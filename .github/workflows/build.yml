name: Build deb
'on':
  push:
    branches: ['work/**']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            repo: https://github.com/theos/theos
            revision: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
            architecture: iphoneos-arm64
          - scheme: roothide
            repo: https://github.com/roothide/theos
            revision: 958fea4f779943505b15b93c88bb4db8d97b346d
            architecture: iphoneos-arm64e
    env:
      THEOS: ${{ runner.temp }}/theos
      SCHEME: ${{ matrix.scheme }}
      EXPECTED_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Test native snapshot parser on macOS
        run: |
          xcrun --sdk macosx clang -fobjc-arc -framework Foundation -framework CoreFoundation Snapshot.m tests/SnapshotTests.m -I . -o "$RUNNER_TEMP/snapshot-tests"
          "$RUNNER_TEMP/snapshot-tests"
      - name: Prepare toolchain
        run: |
          set -euo pipefail
          for formula in make ldid dpkg; do
            brew list "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git init "$THEOS"
          git -C "$THEOS" fetch --depth 1 '${{ matrix.repo }}' '${{ matrix.revision }}'
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive
          git init "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" fetch --depth 1 https://github.com/theos/sdks.git 0222fd5413cf4b9af096f37b4621afa2688572f7
          git -C "$RUNNER_TEMP/sdks" checkout FETCH_HEAD -- iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build and verify package
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$SCHEME"
          set -- packages/*.deb
          test "$#" -eq 1
          test "$(dpkg-deb -f "$1" Architecture)" = "$EXPECTED_ARCH"
          test "$(dpkg-deb -f "$1" Version)" = "$(sed -n 's/^Version: //p' control)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.scheme }}-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: error
